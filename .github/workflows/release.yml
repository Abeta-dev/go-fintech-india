name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Verify and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.24.x'
          cache: false

      - name: Determine Release Tag
        id: tag_info
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release target tag: $TAG"

      - name: Verify Immutable Release Artifact
        env:
          GIT_TAG: ${{ steps.tag_info.outputs.tag }}
        run: ./scripts/verify_release.sh "$GIT_TAG"

      - name: Run Quality Gates
        run: ./scripts/check_coverage.sh

      - name: Verify Published Module from an Isolated Consumer
        env:
          TAG: ${{ steps.tag_info.outputs.tag }}
        run: |
          SCRATCH_DIR=$(mktemp -d)
          trap 'rm -rf "$SCRATCH_DIR"' EXIT
          echo "Testing consumer build in isolated directory: $SCRATCH_DIR with tag ${TAG}"
          cd "$SCRATCH_DIR"
          GOWORK=off go mod init scratchconsumer
          GOWORK=off go get "github.com/umesh0492/go-fintech-india@${TAG}"
          cat << 'EOF' > main.go
          package main

          import (
          	"fmt"
          	fintechin "github.com/umesh0492/go-fintech-india"
          )

          func main() {
          	m := fintechin.NewMoney(10000)
          	fmt.Println("Money:", m.String())
          }
          EOF
          GOWORK=off go build -v .
          ./scratchconsumer
          echo "✅ Published isolated scratch consumer verification passed."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag_info.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; leaving immutable release untouched."
            exit 0
          fi
          echo "Creating release $TAG..."
          gh release create "$TAG" \
            --title "go-fintech-india $TAG" \
            --notes-file <(awk '/^## \[/{n++} n==1' CHANGELOG.md)

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Verify and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.24.x'
          cache: false

      - name: Determine Release Tag
        id: tag_info
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release target tag: $TAG"

      - name: Remote Tag Collision Check
        env:
          TAG: ${{ steps.tag_info.outputs.tag }}
        run: |
          echo "Checking tag collision against remote for $TAG..."
          git fetch --tags origin || true
          REMOTE_TAG_HASH=$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | awk '{print $1}')
          if [ -z "$REMOTE_TAG_HASH" ]; then
            REMOTE_TAG_HASH=$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')
          fi
          LOCAL_HASH=$(git rev-parse HEAD)
          if [ -n "$REMOTE_TAG_HASH" ] && [ "$REMOTE_TAG_HASH" != "$LOCAL_HASH" ]; then
            echo "❌ Error: Tag $TAG already exists on remote pointing to $REMOTE_TAG_HASH, but HEAD is $LOCAL_HASH."
            echo "Tag collision detected! Refusing release."
            exit 1
          fi
          echo "✅ Remote tag check passed: No conflicting tag collision found."

      - name: Run Quality and Truth Gates
        run: |
          ./scripts/check_version.sh
          ./scripts/check_coverage.sh

      - name: Verify 'go get' in Isolated Scratch Directory
        env:
          TAG: ${{ steps.tag_info.outputs.tag }}
        run: |
          SCRATCH_DIR=$(mktemp -d)
          echo "Testing consumer build in isolated directory: $SCRATCH_DIR with tag ${TAG}"
          cd "$SCRATCH_DIR"
          go mod init scratchconsumer
          go mod edit -require "github.com/umesh0492/go-fintech-india@${TAG:-v0.1.0}"
          go mod edit -replace "github.com/umesh0492/go-fintech-india=${GITHUB_WORKSPACE}"
          cat << 'EOF' > main.go
          package main

          import (
          	"fmt"
          	fintechin "github.com/umesh0492/go-fintech-india"
          )

          func main() {
          	m := fintechin.NewMoney(10000)
          	fmt.Println("Money:", m.String())
          }
          EOF
          go build -v .
          ./scratchconsumer
          rm -rf "$SCRATCH_DIR"
          echo "✅ Isolated scratch consumer verification passed."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag_info.outputs.tag }}
        run: |
          EXISTING_IDS=$(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" 2>/dev/null || true)
          for REL_ID in $EXISTING_IDS; do
            if [ -n "$REL_ID" ]; then
              echo "Deleting existing release ID $REL_ID for $TAG..."
              gh api -X DELETE "repos/${{ github.repository }}/releases/$REL_ID"
            fi
          done
          echo "Creating fresh release $TAG..."
          gh release create "$TAG" \
            --title "go-fintech-india $TAG" \
            --notes-file <(awk '/^## \[/{n++} n==1' CHANGELOG.md)

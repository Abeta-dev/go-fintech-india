name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Detect Changed Paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.golangci.yml'

  lint:
    name: GolangCI-Lint
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Enforce gofmt formatting
        run: |
          UNFORMATTED=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Error: Unformatted files detected by gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m

  test:
    name: Test & Race (${{ matrix.go-version }})
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.24.x', '1.25.x', '1.26.x']
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Verify Go Module Integrity
        run: go mod verify

      - name: Run Unit & Fuzz Tests with Race Detector
        run: go test -race -v ./...

  security:
    name: Supply Chain & Vulnerability Scanner
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./...

      - name: Generate CycloneDX SBOM
        run: |
          CYCLONEDX_VERSION="1.12.0"
          curl -fsSL "https://github.com/CycloneDX/cyclonedx-gomod/releases/download/v${CYCLONEDX_VERSION}/cyclonedx-gomod_${CYCLONEDX_VERSION}_linux_amd64.tar.gz" | tar -xz cyclonedx-gomod
          ./cyclonedx-gomod mod -json -output-version 1.5 -output bom.json .
          rm ./cyclonedx-gomod

      - name: Upload CycloneDX SBOM Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: cyclonedx-sbom
          path: bom.json

  gate:
    name: Docs Match Tree Truth Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Run Coverage Gate (>= 90%)
        run: ./scripts/check_coverage.sh

      - name: Run Version & Symbol Truth Gate
        run: ./scripts/check_version.sh

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: ignore

  bench:
    name: High-Throughput Benchmarks
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Run Benchmarks
        run: go test -run=^$ -bench=. -benchmem ./...

  ci-gate:
    name: CI Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - gate
      - lint
      - test
      - security
      - bench
    steps:
      - name: Evaluate CI Quality Gate
        run: |
          echo "========================================================"
          echo "🏁 Evaluating CI Quality Gate"
          echo "   Event: ${{ github.event_name }}"
          echo "   Code changes detected: ${{ needs.changes.outputs.code }}"
          echo "========================================================"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "❌ Path detection failed with: ${{ needs.changes.result }}" >&2
            exit 1
          fi

          if [ "${{ needs.gate.result }}" != "success" ]; then
            echo "❌ Documentation & Version Gate failed with: ${{ needs.gate.result }}" >&2
            exit 1
          fi

          SHOULD_VERIFY_CODE="${{ github.event_name == 'push' || needs.changes.outputs.code == 'true' }}"
          if [ "$SHOULD_VERIFY_CODE" = "true" ]; then
            echo "🔍 Verifying code test suites..."
            FAILED=0

            check_job() {
              local name="$1"
              local result="$2"
              if [ "$result" != "success" ]; then
                echo "❌ $name failed with result: $result" >&2
                FAILED=1
              else
                echo "✅ $name: success"
              fi
            }

            check_job "GolangCI-Lint" "${{ needs.lint.result }}"
            check_job "Test & Race (Matrix)" "${{ needs.test.result }}"
            check_job "Supply Chain Scanner" "${{ needs.security.result }}"
            check_job "High-Throughput Benchmarks" "${{ needs.bench.result }}"

            if [ "$FAILED" -ne 0 ]; then
              echo "❌ CI Quality Gate failed due to errors in code test suite." >&2
              exit 1
            fi
          else
            echo "📄 Docs-only change detected. Heavy test suites (lint, test matrix, security, bench) safely skipped."
          fi

          echo "========================================================"
          echo "✅ All CI Quality Gates successfully satisfied!"
          echo "========================================================"

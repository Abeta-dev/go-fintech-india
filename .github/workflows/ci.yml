name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, 'feat/**', 'stack/**' ]

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect Changed Paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.golangci.yml'

  lint:
    name: GolangCI-Lint
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Enforce gofmt formatting
        run: |
          UNFORMATTED=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Error: Unformatted files detected by gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m

  test:
    name: Test & Race (${{ matrix.go-version }})
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26.x']
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Verify Go Module Integrity
        run: go mod verify

      - name: Run Unit & Fuzz Tests with Race Detector
        run: go test -race -v ./...

  security:
    name: Supply Chain & Vulnerability Scanner
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./...

      - name: Generate CycloneDX SBOM
        run: |
          CYCLONEDX_VERSION="1.12.0"
          curl -fsSL "https://github.com/CycloneDX/cyclonedx-gomod/releases/download/v${CYCLONEDX_VERSION}/cyclonedx-gomod_${CYCLONEDX_VERSION}_linux_amd64.tar.gz" | tar -xz cyclonedx-gomod
          ./cyclonedx-gomod mod -json -output-version 1.5 -output bom.json .
          rm ./cyclonedx-gomod

      - name: Upload CycloneDX SBOM Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyclonedx-sbom
          path: bom.json

  gate:
    name: Docs Match Tree Truth Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install TruffleHog Secret Scanner
        run: |
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/trufflehog.tar.gz "https://github.com/trufflesecurity/trufflehog/releases/download/v3.88.14/trufflehog_3.88.14_linux_amd64.tar.gz"
          tar -xzf /tmp/trufflehog.tar.gz -C /tmp trufflehog
          rm -f /tmp/trufflehog.tar.gz
          echo "/tmp" >> $GITHUB_PATH

      - name: Scan for Leaked Credentials & Secrets
        run: ./scripts/check_secrets.sh

      - name: Run Pure Stdlib Leaf-Import Isolation Gate
        run: ./scripts/check_leaf_imports.sh

      - name: Run Strict N+2 Minor-Release Deprecation Window Gate
        run: ./scripts/check_deprecation.sh

      - name: Run Coverage Gate (>= 90%)
        run: ./scripts/check_coverage.sh

      - name: Run Version & Symbol Truth Gate
        run: ./scripts/check_version.sh

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: ignore

  bench:
    name: High-Throughput Benchmarks
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Run Benchmarks
        run: go test -run=^$ -bench=. -benchmem ./...

  ci-gate:
    name: CI Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - gate
      - lint
      - test
      - security
      - bench
    steps:
      - name: Evaluate CI Quality Gate
        run: |
          echo "========================================================"
          echo "🏁 Evaluating CI Quality Gate"
          echo "   Event: ${{ github.event_name }}"
          echo "   Code changes detected: ${{ needs.changes.outputs.code }}"
          echo "========================================================"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "❌ Path detection failed with: ${{ needs.changes.result }}" >&2
            exit 1
          fi

          if [ "${{ needs.gate.result }}" != "success" ]; then
            echo "❌ Documentation & Version Gate failed with: ${{ needs.gate.result }}" >&2
            exit 1
          fi

          SHOULD_VERIFY_CODE="${{ github.event_name == 'push' || needs.changes.outputs.code == 'true' }}"
          if [ "$SHOULD_VERIFY_CODE" = "true" ]; then
            echo "🔍 Verifying code test suites..."
            FAILED=0

            check_job() {
              local name="$1"
              local result="$2"
              if [ "$result" != "success" ]; then
                echo "❌ $name failed with result: $result" >&2
                FAILED=1
              else
                echo "✅ $name: success"
              fi
            }

            check_job "GolangCI-Lint" "${{ needs.lint.result }}"
            check_job "Test & Race (Matrix)" "${{ needs.test.result }}"
            check_job "Supply Chain Scanner" "${{ needs.security.result }}"
            check_job "High-Throughput Benchmarks" "${{ needs.bench.result }}"

            if [ "$FAILED" -ne 0 ]; then
              echo "❌ CI Quality Gate failed due to errors in code test suite." >&2
              exit 1
            fi
          else
            echo "📄 Docs-only change detected. Heavy test suites (lint, test matrix, security, bench) safely skipped."
          fi

          echo "========================================================"
          echo "✅ All CI Quality Gates successfully satisfied!"
          echo "========================================================"
